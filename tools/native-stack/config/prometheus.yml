# Prometheus — metrics.
#
# Started with --web.enable-otlp-receiver (see run.ps1), which makes Prometheus
# accept OTLP directly at /api/v1/otlp/v1/metrics. That is why the collector
# needs no separate remote-write path.
#
# NOTE: there is deliberately no `storage:` block here. Prometheus's config file
# does not accept one — retention and the TSDB path are CLI flags only, and
# putting them in the YAML fails with
#   field path not found in type config.plain
# Storage is configured via --storage.tsdb.path / --storage.tsdb.retention.time
# in run.ps1 instead.
#
# NOTE ON NAMING: this is Prometheus, not Mimir. The demo project is explicit
# about that everywhere, and this stack makes the same choice grafana/otel-lgtm
# does.

global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Prometheus scraping itself gives the Grafana datasource something to show
  # even before the browser has sent any metrics.
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
